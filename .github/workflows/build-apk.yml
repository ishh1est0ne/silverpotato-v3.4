name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Accept Android SDK licenses & install platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        env:
          NEXT_PUBLIC_API_URL: http://100.102.28.78:4000
        run: npm run build

      - name: Copy Assets and Sync
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r out/* android/app/src/main/assets/public/
          npx @capacitor/cli sync android --verbose || echo "Sync finished with warning, continuing with copied assets"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          set -e -o pipefail
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Found APK files ==="
          find app/build/outputs/apk -name "*.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoKvest-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
