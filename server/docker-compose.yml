version: '3.8'

services:
  # 1. База данных PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: maniyak_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: maniyak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Node.js + Express + Socket.io сервер
  backend:
    build: .
    container_name: maniyak_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:secretpassword@postgres:5432/maniyak
    depends_on:
      - postgres

volumes:
  postgres_data:
